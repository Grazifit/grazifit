name: grazifit_backend
description: "GraziFit - backend Dart. Acesso ao PostgreSQL via Drift."
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.13.2

# ============================================================
# O minimo para o Drift ler o schema real.
#
# shelf, shared/ e argon2 sao da Fase 3. Nao antecipe.
#
# As versoes abaixo foram VERIFICADAS contra este schema em
# PostgreSQL 18 (docs/arquitetura.md secao 1.1). Estao fixadas de
# proposito: se o resolvedor trouxer outra coisa e algo quebrar,
# reporte antes de contornar.
# ============================================================

dependencies:
  drift: 2.34.4
  drift_postgres: 1.3.1
  postgres: 3.5.12

dev_dependencies:
  drift_dev: 2.34.6
  build_runner: ^2.4.0
  test: ^1.25.0
  lints: ^6.0.0
